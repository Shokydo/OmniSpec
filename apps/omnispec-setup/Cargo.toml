[package]
name = "omnispec-setup"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Установщик OmniSpec — консольный, в стиле OmniPanel"

[[bin]]
name = "omnispec-setup"
path = "src/main.rs"

[dependencies]
omnispec-core = { path = "../../crates/omnispec-core" }
tokio = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Иконка и сведения о файле для установщика: без секции ресурсов
# OmniSpec-Setup.exe показывается со стандартным значком консоли.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
