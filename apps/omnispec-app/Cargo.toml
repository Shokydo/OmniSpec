[package]
name = "omnispec-app"
version.workspace = true
edition.workspace = true
description = "OmniSpec — лаунчер Minecraft для офлайн-аккаунтов"
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
dirs = { workspace = true }
getrandom = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
tokio = { workspace = true, features = ["net"] }
futures = { workspace = true }
# Согласованная пользователем публикация локальной иконки для Discord RPC.
reqwest = { workspace = true, features = ["multipart"] }
sha2 = "0.10"
hex = { workspace = true }
omnispec-core = { path = "../../crates/omnispec-core" }
# системные диалоги «проводника»: выбор файла/папки
rfd = "0.15"
# читаем метаданные модов внутри jar и содержимое архивов
zip = { workspace = true }
# .rar в файловом менеджере (пользователь выбрал «оставляем unrar»)
unrar = "0.5"
# картинка из файла или архива отдаётся в окно как data-url
base64 = "0.22"
# миниатюры скриншотов (уменьшение до 480px, JPEG)
image = "0.25"
# имена внутри старых zip-архивов в CP866
encoding_rs = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]
