[workspace]
resolver = "2"
members = ["crates/omnispec-core", "apps/omnispec-app", "apps/omnispec-setup"]

[workspace.package]
version = "0.1.6"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
md-5 = "0.10"
hex = "0.4"
dirs = "5"
futures = "0.3"
regex = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
