name: OmniSpec v0.50.0 preflight
on:
  push:
    branches: ['feature/filters-sounds-v0500']
permissions:
  contents: read
jobs:
  windows-v0500:
    name: Windows WebView2, real audio and history
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Validate core download test repeatedly on Windows
        shell: pwsh
        run: |
          1..5 | ForEach-Object {
            cargo test --locked -p omnispec-core download_with_limited_stack_validates_and_preserves_files
            if ($LASTEXITCODE -ne 0) { throw 'Core socket test failed' }
          }
      - name: Test Windows native backend
        run: cargo test --locked -p omnispec-app
      - name: Build real release launcher
        run: cargo build --locked --release -p omnispec-app
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tools/tests/package-lock.json
      - run: npm ci --prefix tools/tests
      - name: Real WebView2, WAV decoder, history, onboarding and sticky filters
        shell: pwsh
        run: ./tools/tests/windows-v0500-cdp.ps1 -Launcher 'target/release/omnispec-app.exe'
  linux-v0500:
    name: Linux WebKitGTK and native audio
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Install native WebKit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev patchelf \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxkbcommon-dev libwayland-dev \
            xvfb xauth dbus-x11 at-spi2-core python3-websocket xdotool
      - run: cargo build --locked -p omnispec-app
      - name: Real WebKitGTK, WAV decoder, history, onboarding and sticky filters
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1440x900x24' /usr/bin/python3 tools/tests/v0500-linux-native.py
