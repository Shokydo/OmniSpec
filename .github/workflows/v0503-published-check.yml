name: Verify published OmniSpec v0.50.3 on Windows
on:
  push:
    branches: ['arena/v0503-published-check']
permissions:
  contents: read
jobs:
  published-autoupdate:
    name: Published Windows v0.50.0 to v0.50.3 (${{ matrix.auth_mode }})
    runs-on: windows-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        auth_mode: [anonymous, token]
    steps:
      - uses: actions/checkout@v4
      - name: Exercise real update and preserve existing sounds and profile
        shell: pwsh
        env:
          UPDATE_TOKEN: ${{ github.token }}
        run: |
          if ('${{ matrix.auth_mode }}' -eq 'anonymous') {
            ./tools/tests/windows-update-v0503.ps1 -Anonymous
          } else {
            ./tools/tests/windows-update-v0503.ps1
          }
  published-package:
    name: Published Windows layout, sounds and installer
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tools/tests/package-lock.json
      - name: Install WebView2 test tooling
        run: npm ci --prefix tools/tests
      - name: Download published Windows files and verify digests
        shell: pwsh
        env:
          UPDATE_TOKEN: ${{ github.token }}
        run: |
          $headers = @{Authorization=('Bearer ' + $env:UPDATE_TOKEN);Accept='application/vnd.github+json';'User-Agent'='OmniSpec-published-check'}
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/Shokydo/OmniSpec/releases/tags/v0.50.3' -Headers $headers
          $latest = Invoke-RestMethod -Uri 'https://api.github.com/repos/Shokydo/OmniSpec/releases/latest' -Headers $headers
          if ($latest.tag_name -ne 'v0.50.3' -or $release.draft -or $release.prerelease) { throw 'Release is not public latest' }
          New-Item -ItemType Directory -Force -Path 'published-check' | Out-Null
          foreach ($name in @('OmniSpec.exe','OmniSpec-Setup.exe')) {
            $asset = @($release.assets | Where-Object { $_.name -eq $name })
            if ($asset.Count -ne 1 -or $asset[0].digest -notmatch '^sha256:[0-9a-fA-F]{64}$') { throw "No unique digest: $name" }
            $file = Join-Path 'published-check' $name
            Invoke-WebRequest -Uri $asset[0].browser_download_url -OutFile $file
            $got = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
            if ($got -ne $asset[0].digest.Substring(7).ToLowerInvariant()) { throw "Public file hash mismatch: $name" }
            Write-Host "PUBLISHED_WINDOWS_SHA256 $name $got"
          }
      - name: Check published settings layout and sounds in actual WebView2
        shell: pwsh
        run: ./tools/tests/windows-v0500-cdp.ps1 -Launcher 'published-check/OmniSpec.exe'
      - name: Check published Windows installer and shortcuts
        shell: pwsh
        run: ./tools/tests/windows-setup-smoke.ps1 -Setup 'published-check/OmniSpec-Setup.exe' -Launcher 'published-check/OmniSpec.exe' -ExpectedVersion '0.50.3' -VerifyRealIcon
