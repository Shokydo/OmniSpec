name: pages

# Сайт проекта: собирается из site/ и публикуется на GitHub Pages.
# Точка входа — сайт витрины (site/dist), сам лаунчер этот workflow не трогает.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "README.md"
      - ".github/workflows/pages.yml"
  # релиз создаётся workflow «Release» с GITHUB_TOKEN, а такие события не
  # запускают другие workflow — поэтому ловим не release, а завершение сборки
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  # а этого хватает, если релиз опубликован вручную
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Собрать сайт
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # теги нужны: из них собирается список изменений
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Сборка (site/src → site/dist)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 site/build.py
      # свежий снимок (версия и счётчик скачиваний) — обратно в репозиторий,
      # чтобы при недоступности API сайт показывал последнее известное.
      # Пуш через GITHUB_TOKEN не запускает workflow заново — петли нет.
      - name: Сохранить снимок latest.json
        run: |
          git config user.name "OmniSpec Bot"
          git config user.email "bot@omnispec.local"
          git add site/src/latest.json
          if git diff --cached --quiet; then
            echo "снимок не изменился"
          else
            git commit -m "site: свежий снимок latest.json (версия и счётчик скачиваний)"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Опубликовать
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
