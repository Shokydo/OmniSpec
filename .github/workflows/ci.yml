name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Тесты и проверка сборки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверить Discord-анонсы и отсутствие открытых вебхуков
        run: python3 tools/tests/discord_release_test.py

      - name: Установить Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Кэш зависимостей
        uses: swatinem/rust-cache@v2

      - name: Системные библиотеки (Tauri + окно установщика)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev patchelf \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxkbcommon-dev libwayland-dev

      - name: Тесты ядра
        run: cargo test -p omnispec-core

      - name: Тесты Discord RPC
        run: cargo test -p omnispec-app

      - name: Проверка всего workspace
        run: cargo check --workspace

  windows-setup:
    name: Windows — ярлыки и установщик
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Проверить Windows Shell Link и ошибки записи
        run: cargo test -p omnispec-setup --locked
      - name: Подготовить тестовую полезную нагрузку
        shell: pwsh
        run: |
          $file = Join-Path $env:RUNNER_TEMP 'omnispec-test-payload.exe'
          [IO.File]::WriteAllBytes($file, [byte[]](0x4d, 0x5a, 1, 2, 3, 4))
          "OMNISPEC_SETUP_PAYLOAD=$file" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Собрать установщик с тестовой нагрузкой
        run: cargo build -p omnispec-setup --locked
      - name: Проверить фактическую установку, свойства ярлыков и ошибки
        shell: pwsh
        run: |
          $meta = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($meta.packages | Where-Object { $_.name -eq 'omnispec-setup' }).version
          ./tools/tests/windows-setup-smoke.ps1 -Setup 'target/debug/omnispec-setup.exe' -Launcher $env:OMNISPEC_SETUP_PAYLOAD -ExpectedVersion $version

  ui-test:
    name: Интерфейс, диагностика и сетевые сбои
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tools/tests/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
