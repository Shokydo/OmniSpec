name: Preflight profile and animated wallpapers
on:
  push:
    branches: ["arena/profile-wallpaper-v0498"]
permissions:
  contents: read
jobs:
  windows:
    name: Windows WebView2, native file picker and Wallpaper Engine CLI
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Run Windows application unit tests
        run: cargo test -p omnispec-app --locked
      - name: Build actual Windows launcher
        run: cargo build -p omnispec-app --locked
      - name: Exercise real UI, media playback and CLI dispatch
        shell: pwsh
        run: ./tools/tests/windows-profile-preflight.ps1
      - name: Save WebView2 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-profile-screenshots
          path: diagnostic-profile/*.png
          if-no-files-found: ignore
