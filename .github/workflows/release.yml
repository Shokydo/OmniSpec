name: Release

# Собираем OmniSpec.exe на Windows и публикуем релиз.
# Лаунчер сам находит этот релиз через GitHub API и обновляется.
# Адрес Discord хранится только в GitHub Actions Secret DISCORD_WEBHOOK.
# Если адрес когда-либо попал в репозиторий, нужен новый webhook и отзыв старого.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (портативный exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Кэш зависимостей
        uses: swatinem/rust-cache@v2

      - name: Тесты ядра
        run: cargo test --locked -p omnispec-core

      - name: Тесты приложения на Windows
        run: cargo test --locked -p omnispec-app

      - name: Сверить версию в Cargo.toml с тегом
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($meta.packages | Where-Object { $_.name -eq 'omnispec-app' }).version
          $tag = "${{ github.ref_name }}"
          if ("v$version" -ne $tag) {
            Write-Error "Тег $tag не совпадает с version = ""$version"" в Cargo.toml. Поменяй версию перед релизом."
            exit 1
          }

      - name: Сборка
        run: cargo build --locked --release -p omnispec-app

      - name: Проверить аватар и выбор нескольких скинов в настоящем Windows WebView2
        shell: pwsh
        run: ./tools/tests/windows-profile-preflight.ps1 -Launcher 'target/release/omnispec-app.exe' -AvatarOnly

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tools/tests/package-lock.json
      - name: Установить Playwright для проверки настоящего WebView2
        run: npm ci --prefix tools/tests
      - name: Проверить языки и фон в настоящем Windows WebView2
        shell: pwsh
        run: ./tools/tests/windows-language-wallpaper-cdp.ps1 -Launcher 'target/release/omnispec-app.exe'
      - name: Проверить выбор 3D-плащей в настоящем Windows WebView2
        shell: pwsh
        run: ./tools/tests/windows-avatar-wardrobe-cdp.ps1 -Launcher 'target/release/omnispec-app.exe'
      - name: Проверить первый запуск, фильтры, звуки и историю фонов в Windows WebView2
        shell: pwsh
        run: ./tools/tests/windows-v0500-cdp.ps1 -Launcher 'target/release/omnispec-app.exe'
      - name: Проверить нативные иконки и Discord IPC в Windows
        shell: pwsh
        run: ./tools/tests/windows-launcher-icon-cdp.ps1 -Launcher 'target/release/omnispec-app.exe'

      - name: Собрать установщик (консольный, как в OmniPanel)
        shell: pwsh
        run: |
          $env:OMNISPEC_SETUP_PAYLOAD = "target/release/omnispec-app.exe"
          cargo build --locked --release -p omnispec-setup
          if ($LASTEXITCODE -ne 0) { throw "установщик не собрался" }
          # в установщик вшит exe лаунчера — проверяем, что он не пустой
          $setup = Get-Item target/release/omnispec-setup.exe
          $app = Get-Item target/release/omnispec-app.exe
          if ($setup.Length -lt $app.Length) {
            throw "установщик меньше лаунчера — полезная нагрузка не вшилась"
          }
          "Установщик: $([math]::Round($setup.Length / 1MB, 1)) МБ (лаунчер $([math]::Round($app.Length / 1MB, 1)) МБ)"

      - name: Проверить готовый установщик и настоящие ярлыки
        shell: pwsh
        run: |
          $meta = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($meta.packages | Where-Object { $_.name -eq 'omnispec-setup' }).version
          ./tools/tests/windows-setup-smoke.ps1 -Setup 'target/release/omnispec-setup.exe' -Launcher 'target/release/omnispec-app.exe' -ExpectedVersion $version -VerifyRealIcon

      - name: Проверка иконки установщика
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $exe = (Resolve-Path target/release/omnispec-setup.exe).Path
          $info = (Get-Item $exe).VersionInfo
          if ($info.ProductName -ne "OmniSpec") {
            throw "в OmniSpec-Setup.exe нет секции ресурсов (ProductName='$($info.ProductName)')"
          }
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if ($null -eq $icon) { throw "у OmniSpec-Setup.exe нет иконки" }
          $got = $icon.ToBitmap()
          $got.Save("$PWD/setup-icon.png", [System.Drawing.Imaging.ImageFormat]::Png)
          # сверяем с тем, что нарисовал tools/make-icons.py
          $want = [System.Drawing.Bitmap]::FromFile((Resolve-Path "apps/omnispec-app/icons/32x32.png").Path)
          if ($got.Width -ne $want.Width -or $got.Height -ne $want.Height) {
            throw "иконка $($got.Width)x$($got.Height), ожидалась $($want.Width)x$($want.Height)"
          }
          $diff = 0.0
          for ($y = 0; $y -lt $got.Height; $y++) {
            for ($x = 0; $x -lt $got.Width; $x++) {
              $a = $got.GetPixel($x, $y); $b = $want.GetPixel($x, $y)
              $diff += [math]::Abs($a.R - $b.R) + [math]::Abs($a.G - $b.G) + [math]::Abs($a.B - $b.B)
            }
          }
          $diff = $diff / ($got.Width * $got.Height * 3)
          "Среднее расхождение с icons/32x32.png: $([math]::Round($diff, 2))"
          if ($diff -gt 12) { throw "иконка в установщике не совпадает с icons/32x32.png ($diff)" }
          "Иконка на установщике: $($got.Width)x$($got.Height), FileVersion=$($info.FileVersion)"

      - name: Подготовить артефакты
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/omnispec-app.exe dist/OmniSpec.exe
          Copy-Item target/release/omnispec-setup.exe "dist/OmniSpec-Setup.exe"
          $hash = (Get-FileHash "dist/OmniSpec-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  OmniSpec-Setup.exe" | Out-File -Encoding ascii "dist/OmniSpec-Setup.exe.sha256"
          $hash = (Get-FileHash dist/OmniSpec.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  OmniSpec.exe" | Out-File -Encoding ascii dist/OmniSpec.exe.sha256
          $size = [math]::Round((Get-Item dist/OmniSpec.exe).Length / 1MB, 1)
          "Готово: OmniSpec.exe ($size МБ), sha256=$hash"

      - name: Иконка установщика (для проверки глазами)
        uses: actions/upload-artifact@v4
        with:
          name: setup-icon
          path: setup-icon.png

      - name: Сохранить файлы Windows для единой публикации
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/
          if-no-files-found: error
          retention-days: 3

  linux:
    name: Linux (портативный бинарник)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Установить Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Кэш зависимостей
        uses: swatinem/rust-cache@v2

      - name: Системные библиотеки Tauri
        run: |
          sudo apt-get update
          # libwebkit2gtk — для лаунчера (Tauri), libx11/glutin — для окна установщика (egui)
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev patchelf \
            libayatana-appindicator3-1 \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxkbcommon-dev libwayland-dev \
            xvfb xauth dbus-x11 at-spi2-core python3-pyatspi xdotool

      - name: Тесты приложения на Linux
        run: cargo test --locked -p omnispec-app

      - name: Сборка
        run: cargo build --locked --release -p omnispec-app

      - name: Проверить языки в настоящем Linux WebKitGTK
        env:
          LANGUAGE_BINARY: target/release/omnispec-app
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1440x900x24' /usr/bin/python3 tools/tests/language-linux-native.py

      - name: Проверить аватар и скролл скинов в настоящем Linux WebKitGTK
        env:
          AVATAR_BINARY: target/release/omnispec-app
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1440x900x24' /usr/bin/python3 tools/tests/avatar-linux-native.py

      - name: Собрать установщик
        run: |
          OMNISPEC_SETUP_PAYLOAD=target/release/omnispec-app cargo build --locked --release -p omnispec-setup

      - name: Подготовить артефакты
        run: |
          mkdir -p dist
          cp target/release/omnispec-app dist/OmniSpec
          # Старые Linux-версии выбирают для автообновления все имена
          # omnispec* без точки. Расширение защищает их от выбора установщика.
          cp target/release/omnispec-setup dist/omnispec-setup.bin
          chmod +x dist/OmniSpec dist/omnispec-setup.bin
          sha256sum dist/OmniSpec | sed 's|dist/||' > dist/OmniSpec.sha256
          sha256sum dist/omnispec-setup.bin | sed 's|dist/||' > dist/omnispec-setup.bin.sha256

      - name: Сохранить файлы Linux для единой публикации
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Опубликовать полный релиз
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: dist
      - name: Подготовить описание релиза и список изменений
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tools/release_body.py
      # Пока загружаются файлы, новая версия остаётся черновиком: старые
      # лаунчеры не увидят обновление только с одной платформой.
      - name: Загрузить оба комплекта в черновик
        id: release_draft
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            dist/OmniSpec.exe
            dist/OmniSpec.exe.sha256
            dist/OmniSpec-Setup.exe
            dist/OmniSpec-Setup.exe.sha256
            dist/OmniSpec
            dist/OmniSpec.sha256
            dist/omnispec-setup.bin
            dist/omnispec-setup.bin.sha256
          generate_release_notes: true
          body_path: dist/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Сверить все файлы и сделать релиз публичным
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ID: ${{ steps.release_draft.outputs.id }}
        run: python3 tools/publish_release.py

  announce:
    name: Анонс в Discord
    needs: [publish]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Пост анонса с патч-листом в Discord
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re, subprocess, urllib.error, urllib.parse, urllib.request

          webhook = os.environ.get("DISCORD_WEBHOOK", "").strip()
          if not webhook:
              raise SystemExit("GitHub Secret DISCORD_WEBHOOK не настроен; анонс не отправлен.")
          try:
              url = urllib.parse.urlsplit(webhook)
              valid = (url.scheme == "https"
                       and url.hostname in {"discord.com", "discordapp.com", "canary.discord.com", "ptb.discord.com"}
                       and not url.username and not url.password and url.port is None and not url.fragment
                       and re.fullmatch(r"/api/webhooks/\d{15,24}/[A-Za-z0-9._-]{8,200}/?", url.path))
          except ValueError:
              valid = False
          if not valid:
              raise SystemExit("GitHub Secret DISCORD_WEBHOOK содержит некорректный адрес Discord.")
          tag = os.environ["TAG"]
          logo = "https://raw.githubusercontent.com/Shokydo/OmniSpec/main/apps/omnispec-app/ui/assets/logo.png"

          body = subprocess.run(
              ["gh", "release", "view", tag, "--json", "body", "--jq", ".body"],
              capture_output=True, text=True,
          ).stdout
          # Только список изменений (секция What's Changed), без инструкции по установке.
          notes = body
          marker = "## What's Changed"
          if marker in body:
              notes = body.split(marker, 1)[1].strip()
          notes = notes[:4000] or "Описание изменений не указано."

          embed = {
              "title": f"🚀 OmniSpec {tag}",
              "description": notes,
              "color": 0x5865F2,
              "thumbnail": {"url": logo},
              "fields": [{
                  "name": "Скачать",
                  "value": f"https://github.com/Shokydo/OmniSpec/releases/tag/{tag}",
                  "inline": False,
              }],
              "footer": {"text": "OmniSpec"},
          }
          payload = json.dumps({
              "username": "OmniSpec",
              "avatar_url": logo,
              "allowed_mentions": {"parse": []},
              "embeds": [embed],
          }).encode()
          # Не передаём секрет через редирект и не печатаем его при ошибках.
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          req = urllib.request.Request(
              webhook,
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36",
              },
          )
          try:
              with urllib.request.build_opener(NoRedirect).open(req, timeout=20) as resp:
                  print("Discord анонс отправлен:", resp.status)
          except urllib.error.HTTPError as exc:
              raise SystemExit(f"Discord не принял анонс (HTTP {exc.code}).")
          except Exception:
              raise SystemExit("Не удалось связаться с Discord; анонс не отправлен.")
          PYEOF
